name: Shanghai Disney continuous daytime queue test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shanghai-disney-24h.yml'
  workflow_dispatch:
  schedule:
    # UTC: backup starts for Nov 13 and 14, 08:00, 08:15, 08:30,
    # 09:10, 11:10, 14:10 and 17:10 Shanghai time.
    # Each started chain handles its own remaining segments.
    - cron: '0,15,30 0 13,14 11 *'
    - cron: '10 1,3,6,9 13,14 11 *'
    # Final shutdown retry (if the last chain was delayed or skipped).
    - cron: '35 13 14 11 *'

permissions:
  contents: read
  actions: write

concurrency:
  group: shanghai-disney-continuous-daytime
  cancel-in-progress: false

jobs:
  segment_1:
    name: Daytime segment 1
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Continuous polling every five minutes
        run: python3 -u continuous.py --segment 1
      - name: Archive segment samples and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-${{ github.run_id }}-attempt-${{ github.run_attempt }}-segment-1
          path: continuous-output/
          retention-days: 7
          if-no-files-found: ignore

  segment_2:
    name: Daytime segment 2
    runs-on: ubuntu-latest
    timeout-minutes: 300
    needs: segment_1
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4
      - name: Continuous polling every five minutes
        run: python3 -u continuous.py --segment 2
      - name: Archive segment samples and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-${{ github.run_id }}-attempt-${{ github.run_attempt }}-segment-2
          path: continuous-output/
          retention-days: 7
          if-no-files-found: ignore

  segment_3:
    name: Daytime segment 3
    runs-on: ubuntu-latest
    timeout-minutes: 300
    needs: segment_2
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4
      - name: Continuous polling every five minutes
        run: python3 -u continuous.py --segment 3
      - name: Archive segment samples and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-${{ github.run_id }}-attempt-${{ github.run_attempt }}-segment-3
          path: continuous-output/
          retention-days: 7
          if-no-files-found: ignore

  close:
    name: Stop after final operating day
    needs: [segment_1, segment_2, segment_3]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check final cutoff
        id: window
        run: python3 monitor.py --gate
      - name: Disable finished experiment
        if: steps.window.outputs.expired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/shanghai-disney-24h.yml/disable"
          echo "The experiment has ended." >> "$GITHUB_STEP_SUMMARY"
