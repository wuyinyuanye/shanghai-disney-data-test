name: Shanghai Disney 2-day daytime queue sync test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shanghai-disney-24h.yml'
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC; Shanghai time is UTC+8.
    # Nov 11 & 12, 08:30-08:55 China time
    - cron: '30-59/5 0 11,12 11 *'
    # Nov 11 & 12, 09:00-20:55 China time
    - cron: '*/5 1-12 11,12 11 *'
    # Nov 11 & 12, 21:00-21:25 China time
    - cron: '0-25/5 13 11,12 11 *'
    # Nov 12, 21:35 China time: shutdown check only, no API requests
    - cron: '35 13 12 11 *'

permissions:
  contents: read
  actions: write

concurrency:
  group: shanghai-disney-2-day-daytime-sample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check two park-day sampling windows
        id: window
        run: python3 monitor.py --gate

      - name: Retrieve and compare Shanghai Disneyland wait times
        if: steps.window.outputs.active == 'true'
        run: python3 monitor.py

      - name: Save raw API data and comparison report
        if: always() && steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shanghai-disney-sample-${{ github.run_id }}
          path: probe-output/
          retention-days: 7
          if-no-files-found: warn

      - name: Automatically stop monitoring after window closes
        if: steps.window.outputs.expired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/shanghai-disney-24h.yml/disable"
          echo "Both operating-day windows have closed. Scheduled workflow disabled." >> "$GITHUB_STEP_SUMMARY"
